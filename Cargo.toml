[workspace]
resolver = "3"
members = ["crates/tessera-core", "crates/tessera", "crates/tessera-icon"]
default-members = ["crates/tessera-core", "crates/tessera"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.95"
authors = ["Gijsbert van Renswoude"]

[workspace.dependencies]
tessera-core = { path = "crates/tessera-core" }
libc = "0.2"
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1.1", features = ["use-std"] }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
block2 = "0.6"
eframe = { version = "0.37", default-features = false }
egui = "0.37"
tiny-skia = "0.11"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
debug = false

[profile.dev.package."*"]
opt-level = 2
